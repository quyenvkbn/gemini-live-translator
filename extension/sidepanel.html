<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Live Translator</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header><div class="brand"><span class="orb">✦</span><div><strong>Gemini Live</strong><small>Translator</small></div></div><span id="status" class="status">Sẵn sàng</span></header>
  <label class="field">Backend WebSocket URL<input id="backendUrl" value="wss://gemini-live-translator-zv4s.onrender.com/live" /></label>
  <button id="start" class="primary" type="button">▶ Dịch tab hiện tại</button>
  <button id="stop" disabled type="button">■ Dừng</button>
  <p class="hint">Mở video/audio trên tab hiện tại (YouTube, Facebook…), sau đó bấm nút này. Chrome sẽ xin quyền lấy âm thanh của tab.</p>
  <section><h2>Nghe được</h2><p id="source">Đang chờ âm thanh…</p></section>
  <section class="translated"><h2>Bản dịch tiếng Việt</h2><p id="translation">Bản dịch sẽ xuất hiện ở đây…</p></section>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
